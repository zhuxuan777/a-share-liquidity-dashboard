name: Update A-share dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 1-7 * * 1-5'
    - cron: '17 8 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: a-share-dashboard-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile build_dashboard.py eastmoney.py us_modules.py

      - name: Restore generated data cache
        uses: actions/cache@v4
        with:
          path: data
          key: a-share-dashboard-data-${{ github.run_id }}
          restore-keys: a-share-dashboard-data-

      - name: Build current dashboard
        run: python build_dashboard.py --snapshot-update --workers 12 --output index.html

      - name: Package GitHub Pages site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/market_metrics.csv data/latest_stock_snapshot.csv _site/data/
          if [ -f data/us_current_signals.json ]; then cp data/us_current_signals.json _site/data/; fi
          python - <<'PY'
          import csv
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          html = Path('index.html').read_text(encoding='utf-8')
          assert 'A股流动性与市场宽度看板' in html
          with open('data/market_metrics.csv', encoding='utf-8-sig') as handle:
              metrics = list(csv.DictReader(handle))
          status = {
              'market_date': metrics[-1]['日期'],
              'generated_at': datetime.now(ZoneInfo('Asia/Shanghai')).isoformat(),
              'timezone': 'Asia/Shanghai',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_number': os.environ.get('GITHUB_RUN_NUMBER'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'repository': os.environ.get('GITHUB_REPOSITORY'),
          }
          Path('_site/data/build_status.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
